<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flask</title>
<style>
:root{--bg:#fff;--fg:#1a1a1f;--muted:#5c5c66;--accent:#7c3aed;--rule:#e4e4ea}
@media (prefers-color-scheme:dark){:root{--bg:#121216;--fg:#ececf1;--muted:#a0a0ab;--accent:#a78bfa;--rule:#2c2c34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.8rem;line-height:1.25;margin:0 0 .25em}
h2{font-size:1.2rem;margin:2em 0 .4em;padding-top:1em;border-top:1px solid var(--rule)}
a{color:var(--accent)}
.muted{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Flask</h1>
<p>Flask is an experimental client for Bluesky, distributed to testers through TestFlight. It is not made or endorsed by Bluesky Social PBC.</p>
<p><a href="privacy/">Privacy policy</a></p>
<p class="muted">Feedback goes through TestFlight or <a href="mailto:bryan@makeworkbetter.io">bryan@makeworkbetter.io</a>.</p>
</main>
</body>
</html>
