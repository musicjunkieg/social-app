<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flask Privacy Policy has moved</title>
<link rel="canonical" href="https://flask.social/privacy/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://flask.social/privacy/">
<script>location.replace('https://flask.social/privacy/')</script>
<style>
:root{--bg:#fff;--fg:#1a1a1f;--accent:#7c3aed}
@media (prefers-color-scheme:dark){:root{--bg:#121216;--fg:#ececf1;--accent:#a78bfa}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:32px 16px}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<p>The Flask Privacy Policy has moved to <a href="https://flask.social/privacy/">flask.social/privacy</a>.</p>
</main>
</body>
</html>
